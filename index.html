<!DOCTYPE HTML>
<html>
    <head>
        <title>Aeryli's spinnin' foosh</title>
        <link rel="icon" href="https://aeryli.win/ico.png">
        <style>
            body {
                width: 100vw;
                height: 100vh;
                margin: 0;
                padding: 0;
                background-image: url("https://www.aeryli.win/fish.gif");
                background-repeat: repeat;
                animation: scrollPattern 4s linear infinite;
                display: grid;
                place-items: center;
            }
            
            @keyframes scrollPattern {
                from {
                    background-position: 0 0;
                }
                to {
                    /* Move by the exact width and height of the background-size */
                    background-position: -360px -247px; 
                }
            }

        </style>
    </head>
    <body>
        <link rel="stylesheet" href="https://unpkg.com/98.css@0.1.21/dist/98.css">
        <div class="window" style="width: 50vw; height: 50vh;">
            <div class="title-bar">
                <div class="title-bar-text">Aeryli's site</div>
                    <div class="title-bar-controls">
                    <button aria-label="Minimize"></button>
                    <button aria-label="Maximize"></button>
                    <button aria-label="Close"></button>
                </div>
            </div>
            <div class="window-body">
                <div style="height: 60vh;">
                    <h3>Hello!!</h3><br>
                    <img src="https://www.aeryli.win/hii.gif" alt="waving">
                    <br>
                    <br>
                </div>
            </div>
            <div class="status-bar">
            </div>
        </div>
    </body>
</html>
