<!DOCTYPE HTML>
<html>
    <head>
        <title>Aeryli's spinnin' foosh</title>
        <link rel="icon" href="https://aeryli.win/ico.png">
        <style>
            body {
                width: 100vw;
                height: 100vh;
                margin: 0;
                padding: 0;
                background-image: url("https://aeryli.win/fish.gif");
                background-repeat: repeat;
                animation: scrollPattern 4s linear infinite;
                display: grid;
                place-items: center;
            }
            
            @keyframes scrollPattern {
                from {
                    background-position: 0 0;
                }
                to {
                    /* Move by the exact width and height of the background-size */
                    background-position: -360px -247px; 
                }
            }
            .window {
                width: calc(fit-content + 10px);
                height: calc(fit-content + 10px)
            }
            .fullscreens {
                width: 99vw;
                height: 98vh;
            }
            .mobilebig {
                zoom: 400%;
            }
        </style>
        <script>
            let cheese;
            function strToE(htmlString) {
                let t = document.createElement('template');
                t.innerHTML = htmlString.trim();
                return t.content.firstElementChild;
            }
            console.log(navigator.userAgent);
            function chezz() {
                if (navigator.userAgent.includes('Mobile')) {
                    console.log("zoomin'");
                    document.getElementById("window0").classList.add('mobilebig');
                }
            }
        </script>
        <link rel="stylesheet" href="https://unpkg.com/98.css@0.1.21/dist/98.css">
    </head>
    <body onload="chezz()">
        <div class="window" id="window0">
            <div class="title-bar">
                <div class="title-bar-text">Aeryli's site</div>
                <div class="title-bar-controls">
                    <button aria-label="Minimize" onclick="cheese = document.body.innerHTML; document.body.innerText = ''; document.body.appendChild(strToE(atob('PGJ1dHRvbiBhcmlhLWxhYmVsPSJNaW5pbWl6ZSIgb25jbGljaz0iZG9jdW1lbnQuYm9keS5pbm5lclRleHQgPSAnJzsgZG9jdW1lbnQuYm9keS5hcHBlbmRDaGlsZChzdHJUb0UoY2hlZXNlKSk7Ij5TaG93PC9idXR0b24+')));"></button>
                    <button aria-label="Maximize" onclick="document.getElementById('window0').classList.toggle('fullscreens');"></button>
                    <button aria-label="Close" onclick="window.location.href = 'https://github.com/aeryli/';"></button>
                </div>
            </div>
            <div class="window-body">
                <h3>Hello!!</h3><br>
                <img src="https://www.aeryli.win/hii.gif" alt="waving">
            </div>
            <div class="status-bar"></div>
        </div>
    </body>
</html>
