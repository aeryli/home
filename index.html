<!DOCTYPE HTML>
<html>
    <head>
        <title>Aeryli's spinnin' foosh</title>
        <style>
            .looping-bg {
                width: 100%;
                height: 100vh;
                background-image: url("./fish.gif");
                background-repeat: repeat;
                /* Set explicit size so the keyframe distance matches */
                background-size: 200px 200px; 
                animation: scrollPattern 4s linear infinite;
            }
            
            @keyframes scrollPattern {
                from {
                    background-position: 0 0;
                }
                to {
                    /* Move by the exact width and height of the background-size */
                    background-position: -200px -200px; 
                }
            }

        </style>
    </head>
    <body>
        <div class="top">
    </body>
</html>
